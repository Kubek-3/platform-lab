
name: Build, Test and Publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hello-app:test .

      - name: Run test container
        run: docker run -d --name hello-app -p 127.0.0.1:8080:8080 hello-app:test

      - name: Test HTTP response
        run: |
    response=$(curl \
      --retry 10 \
      --retry-delay 2 \
      --retry-all-errors \
      --fail \
      --silent \
      --show-error \
      http://127.0.0.1:8080)
          test "$response" = "Hello from container! Version 1.0"

      - name: Test non-root user
        run: test "$(docker exec hello-app id -u)" != "0"

      - name: Remove test container
        if: always()
        run: docker rm -f hello-app || true

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
